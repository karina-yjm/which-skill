<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">which-skill  three hard rules</title>
  <desc id="desc">Recommend-only, quote-backed, live catalog.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1280" height="520" fill="url(#bg)"/>
  <text x="64" y="72" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">Three hard rules</text>
  <text x="64" y="112" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#94A3B8">What makes which-skill different from a keyword router</text>

  <g filter="url(#soft)">
    <rect x="64" y="160" width="360" height="300" rx="22" fill="#111827" stroke="#334155"/>
    <rect x="64" y="160" width="360" height="8" rx="4" fill="#F59E0B"/>
    <text x="92" y="220" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="800" fill="#FBBF24">Recommend-only</text>
    <text x="92" y="270" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#E2E8F0">Never silently autoload</text>
    <text x="92" y="305" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#E2E8F0">another skill.</text>
    <text x="92" y="360" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" fill="#94A3B8">You confirm before anything runs.</text>
  </g>

  <g filter="url(#soft)">
    <rect x="460" y="160" width="360" height="300" rx="22" fill="#111827" stroke="#334155"/>
    <rect x="460" y="160" width="360" height="8" rx="4" fill="#14B8A6"/>
    <text x="488" y="220" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="800" fill="#5EEAD4">Quote-backed</text>
    <text x="488" y="270" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#E2E8F0">Every pick must cite a</text>
    <text x="488" y="305" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#E2E8F0">verbatim phrase from the</text>
    <text x="488" y="340" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#E2E8F0">skill description.</text>
    <text x="488" y="395" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" fill="#94A3B8">No sounds related guesses.</text>
  </g>

  <g filter="url(#soft)">
    <rect x="856" y="160" width="360" height="300" rx="22" fill="#111827" stroke="#334155"/>
    <rect x="856" y="160" width="360" height="8" rx="4" fill="#60A5FA"/>
    <text x="884" y="220" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="800" fill="#93C5FD">Live catalog</text>
    <text x="884" y="270" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#E2E8F0">Scan installed skills now.</text>
    <text x="884" y="305" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#E2E8F0">No rotting domain’skill</text>
    <text x="884" y="340" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#E2E8F0">lookup tables.</text>
    <text x="884" y="395" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" fill="#94A3B8">Your machine, your catalog.</text>
  </g>
</svg>
