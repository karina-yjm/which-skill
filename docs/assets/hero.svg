<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">which-skill  intent match, not keyword match</title>
  <desc id="desc">Comparison: keyword triggers miss paraphrases; which-skill recommends with a quote and waits for confirmation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="180" fill="#14B8A6" opacity="0.12"/>
  <circle cx="160" cy="560" r="220" fill="#F59E0B" opacity="0.08"/>

  <text x="64" y="78" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC">which-skill</text>
  <text x="64" y="118" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF">Users don't speak trigger words.</text>
  <text x="64" y="164" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" fill="#CBD5E1">Intent match · quote-backed · recommend-only · never autoload</text>

  <!-- User bubble -->
  <g filter="url(#soft)">
    <rect x="64" y="220" width="1152" height="72" rx="18" fill="#0F172A" stroke="#334155"/>
  </g>
  <text x="92" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#94A3B8">You:</text>
  <text x="170" y="264" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="24" font-weight="600" fill="#F8FAFC">Is my page friendly to color-blind users?</text>

  <!-- Left: keyword miss -->
  <g filter="url(#soft)">
    <rect x="64" y="330" width="540" height="240" rx="22" fill="url(#card)" stroke="#7F1D1D"/>
  </g>
  <rect x="64" y="330" width="540" height="56" rx="22" fill="#7F1D1D"/>
  <rect x="64" y="360" width="540" height="26" fill="#7F1D1D"/>
  <text x="92" y="366" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#FECACA">Keyword trigger</text>
  <text x="500" y="366" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="800" fill="#FCA5A5"></text>
  <text x="92" y="430" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#E2E8F0">Skill only listens for:</text>
  <text x="92" y="470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#FCA5A5">audit a11y</text>
  <text x="92" y="510" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#FCA5A5">check accessibility</text>
  <text x="92" y="550" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" fill="#94A3B8">Same job. Different words. Miss.</text>

  <!-- Right: which-skill hit -->
  <g filter="url(#soft)">
    <rect x="676" y="330" width="540" height="240" rx="22" fill="url(#card)" stroke="#115E59"/>
  </g>
  <rect x="676" y="330" width="540" height="56" rx="22" fill="#0F766E"/>
  <rect x="676" y="360" width="540" height="26" fill="#0F766E"/>
  <text x="704" y="366" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#CCFBF1">which-skill</text>
  <text x="1110" y="366" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="800" fill="#5EEAD4"></text>
  <text x="704" y="430" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#E2E8F0">Recommend:</text>
  <text x="830" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#5EEAD4">accessibility-review</text>
  <text x="704" y="480" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" fill="#94A3B8">Quote from description:</text>
  <text x="704" y="516" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" fill="#F8FAFC">color contrast& keyboard navigation&</text>
  <text x="704" y="550" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" fill="#FBBF24">Recommend-only  waits for your OK</text>
</svg>
